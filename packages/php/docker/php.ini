; Limites de upload — ajuste conforme o tamanho das planilhas
upload_max_filesize = 20M
post_max_size       = 21M
memory_limit        = 512M
max_execution_time  = 60

; Nunca expor erros/warnings/notices no corpo da resposta (quebra o JSON da API).
; Em vez disso, registrar em arquivo para diagnóstico.
display_errors      = Off
display_startup_errors = Off
log_errors          = On
error_log           = /var/www/app/storage/logs/php-error.log
