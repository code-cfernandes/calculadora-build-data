services:
  api:
    build:
      context: ./packages/php
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:80"
    networks:
      - app

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - app

networks:
  app:
    driver: bridge
